<div class="page-wrapper">
  <div class="page-container">
    <div class="page-header-premium mb-4 flex-wrap">
      <div>
        <h2 class="section-title mb-1">Modifier la tâche</h2>
        <p class="section-subtitle">Mettez à jour les informations de la tâche</p>
      </div>

      <a routerLink="/tasks" class="btn btn-light-custom">
        <i class="bi bi-arrow-left me-2"></i>
        Retour à la liste
      </a>
    </div>

    @if (loading) {
      <div class="app-card text-center">
        <p class="mb-0">Chargement...</p>
      </div>
    } @else {
      <div class="app-card premium-card">
        <div class="card-accent"></div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label">Titre</label>
              <input type="text" class="form-control" formControlName="title" />
              @if (hasError('title')) {
                <small class="text-danger">Le titre est obligatoire (min 2 caractères).</small>
              }
            </div>

            <div class="col-md-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="4" formControlName="description"></textarea>
            </div>

            <div class="col-md-4">
              <label class="form-label">Statut</label>
              <select class="form-select" formControlName="status">
                <option value="TODO">TODO</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="DONE">DONE</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Priorité</label>
              <select class="form-select" formControlName="priority">
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Date limite</label>
              <input type="datetime-local" class="form-control" formControlName="dueDate" />
            </div>

            <div class="col-12">
              <div class="task-form-actions">
                <button type="submit" class="btn btn-primary btn-premium" [disabled]="saving">
                  <i class="bi bi-save me-2"></i>
                  {{ saving ? 'Sauvegarde...' : 'Enregistrer' }}
                </button>

                <a routerLink="/tasks" class="btn btn-light-custom btn-premium">
                  Retour
                </a>
              </div>
            </div>
          </div>
        </form>
      </div>
    }
  </div>
</div>
