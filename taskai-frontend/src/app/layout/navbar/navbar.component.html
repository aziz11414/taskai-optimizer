<div class="topbar d-flex align-items-center justify-content-between flex-wrap gap-3">
  <div class="d-flex align-items-center gap-3">
    <div class="brand-icon logo-box">
      <img src="assets/icons/logo.png" alt="AI Task Optimizer logo" class="nav-logo" />
    </div>

    <div>
      <h5 class="mb-0 fw-bold">AI Task Optimizer</h5>
      <small class="text-muted">Smart productivity dashboard</small>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2 flex-wrap">
    <a routerLink="/dashboard" class="btn btn-light-custom btn-sm topbar-btn">
      <i class="bi bi-speedometer2 me-1"></i>
      Dashboard
    </a>

    <a routerLink="/notifications" class="btn btn-light-custom btn-sm topbar-btn notification-btn">
      <div class="notification-bell-wrapper">
        <i class="bi bi-bell fs-5"></i>
        @if (unreadCount() > 0) {
          <span class="notification-badge">{{ unreadCount() }}</span>
        }
      </div>
    </a>

    <button class="btn btn-outline-primary btn-sm topbar-btn" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i>
      Logout
    </button>
  </div>
</div>
